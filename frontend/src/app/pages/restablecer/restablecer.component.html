<div class="auth-container">
  <h1>Restablecer contraseña</h1>

  <div *ngIf="!submitted; else exito">
    <form (ngSubmit)="onSubmit()" #restablecerForm="ngForm">
      <div class="form-group">
        <label for="nueva">Nueva contraseña</label>
        <input
          type="password"
          id="nueva"
          name="nueva"
          [(ngModel)]="passwords.nueva"
          required
          minlength="6"
        />
      </div>

      <div class="form-group">
        <label for="confirmar">Confirmar nueva contraseña</label>
        <input
          type="password"
          id="confirmar"
          name="confirmar"
          [(ngModel)]="passwords.confirmar"
          required
        />
      </div>

      <app-custom-button
        type="submit"
        text="Cambiar contraseña"
        [disabled]="restablecerForm.invalid || passwords.nueva !== passwords.confirmar"
      >
      </app-custom-button>
    </form>
  </div>

  <ng-template #exito>
    <div class="exito">
      <p>¡Contraseña actualizada! Serás redirigido al inicio de sesión...</p>
    </div>
  </ng-template>
</div>
