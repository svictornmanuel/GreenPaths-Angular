<div class="auth-container">
  <h1>Recuperar contraseña</h1>

  <div *ngIf="!submitted; else confirmacion">
    <p class="instructions">
      Ingresa tu correo electrónico y te enviaremos un enlace para restablecer
      tu contraseña.
    </p>

    <form (ngSubmit)="onSubmit()" #recuperarForm="ngForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          email
        />
      </div>

      <app-custom-button
        type="submit"
        text="Enviar enlace"
        [disabled]="recuperarForm.invalid ?? false"
      >
      </app-custom-button>
    </form>
  </div>

  <ng-template #confirmacion>
    <div class="confirmacion">
      <p>
        ¡Correo enviado! Revisa tu bandeja de entrada para continuar con el
        proceso.
      </p>
      <a routerLink="/login" class="back-link">Volver a inicio de sesión</a>
    </div>
  </ng-template>

  <p class="auth-link"><a routerLink="/login">Volver a inicio de sesión</a></p>
</div>
