<div class="auth-container">
  <h1>Iniciar sesión</h1>
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="credentials.email"
        required
        email
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="credentials.password"
        required
      />
    </div>

    <div class="form-check">
      <input
        type="checkbox"
        id="remember"
        name="remember"
        [(ngModel)]="credentials.remember"
      />
      <label for="remember">Recordarme</label>
    </div>

    <app-custom-button
      type="submit"
      text="Iniciar sesión"
      [disabled]="loginForm.invalid ?? false"
    >
    </app-custom-button>
  </form>

  <div class="auth-links">
    <p><a routerLink="/recuperar">¿Olvidaste tu contraseña?</a></p>
    <p>¿No tienes cuenta? <a routerLink="/registro">Crear nueva cuenta</a></p>
  </div>
</div>
