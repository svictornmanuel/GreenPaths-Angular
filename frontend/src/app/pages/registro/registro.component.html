<div class="auth-container">
  <h1>Crear cuenta</h1>
  <form (ngSubmit)="onSubmit()" #registroForm="ngForm">
    <div class="form-group">
      <label for="nombre">Nombre completo</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="user.nombre"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="user.email"
        required
        email
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="user.password"
        required
        minlength="6"
      />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmar contraseña</label>
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        [(ngModel)]="user.confirmPassword"
        required
      />
    </div>

    <div class="form-check">
      <input
        type="checkbox"
        id="terminos"
        name="terminos"
        [(ngModel)]="user.terminos"
        required
      />
      <label for="terminos">Acepto los términos y condiciones</label>
    </div>

    <app-custom-button
      type="submit"
      text="Registrarse"
      [disabled]="registroForm.invalid || !user.terminos"
    >
    </app-custom-button>
  </form>

  <p class="auth-link">
    ¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a>
  </p>
</div>
